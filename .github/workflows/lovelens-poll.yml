name: Love Lens approval poll

# Checks Telegram for your Approve/Reject taps and posts approved items. A quick
# check every 30 min keeps this cheap on a PRIVATE repo (2,000 free Actions min/mo):
# each run is ~1 min, so ~1,400 min/mo. For instant posting after you approve, run
# this workflow on demand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Shared with the generate workflow so pending.json is never written by two runs at once.
concurrency:
  group: lovelens-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests python-dotenv

      - name: Write .env from secrets
        run: |
          umask 177
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN=${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          EOF

      - name: Process approvals (quick check — cheap on a private repo)
        env:
          LOVELENS_POLL_SECONDS: "0"   # single quick check per run; offset persists in pending.json
        run: python approve_poll.py

      - name: Commit pending queue
        run: |
          git config user.name "lovelens-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending.json
          git diff --staged --quiet || git commit -m "chore: update approval queue [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true
