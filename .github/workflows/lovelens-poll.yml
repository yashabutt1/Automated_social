name: Love Lens approval poll

# Posts your Telegram Approve taps to Facebook. This is a LONG-RUNNING poller: each
# run long-polls Telegram continuously for ~5.5 hours so a tap is caught and posted
# within seconds — not a quick check that almost never overlaps a tap. The cron keeps
# a fresh run queued behind the active one, so coverage is effectively 24/7. Public
# repo => unlimited Actions minutes, so a mostly-idle long poll is free.
on:
  schedule:
    - cron: "*/15 * * * *"   # keeps a run queued behind the active one (GitHub may delay these)
  workflow_dispatch: {}

# Its OWN group (NOT shared with generate): the poll never writes pending.json, so it
# can run continuously without blocking the generate workflow. One poll at a time.
concurrency:
  group: lovelens-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub hard-caps a job at 6h; stay under it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests python-dotenv

      - name: Write .env from secrets
        run: |
          umask 177
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN=${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          EOF

      - name: Process approvals (continuous long-poll)
        env:
          # ~5.5h of continuous long-polling; each iteration confirms the prior taps
          # with Telegram, so handled approvals never repeat even though we persist nothing.
          LOVELENS_POLL_SECONDS: "19800"
          # Refresh the queued items from the live repo each loop, so cards queued
          # AFTER this job started are still approvable.
          PENDING_URL: "https://raw.githubusercontent.com/yashabutt1/Automated_social/main/pending.json"
        run: python approve_poll.py
